name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit + gRPC tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: .m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      - name: Build, unit tests, gRPC cluster tests
        run: ./mvnw -B -ntp verify -DexcludedGroups=fault
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-reports
          path: '**/target/surefire-reports/'

  fault-injection:
    # Election, replication, crash, Figure 8, snapshot and linearizability tests on the simulated faulty network.
    # Run twice in parallel: randomized fault tests that only fail sometimes are bugs, and two runs per push catch more.
    name: fault injection (run ${{ matrix.run }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: .m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      - name: Fault-injection suite
        run: ./mvnw -B -ntp verify -Dgroups=fault
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fault-reports-${{ matrix.run }}
          path: '**/target/surefire-reports/'

  docker-chaos:
    # Real processes in containers: kill -9 the leader, restart it, partition a follower, partition the leader.
    name: docker cluster chaos test
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: .m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      - name: Build jar
        run: ./mvnw -B -ntp package -DskipTests
      - name: Chaos test (3 nodes)
        run: bash scripts/chaos.sh
      - name: Upload cluster logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-logs
          path: chaos-logs.txt
