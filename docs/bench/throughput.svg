<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Write throughput vs. concurrent clients" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<style>
