# 3-node RaftKV cluster. Build the image first:
#   ./mvnw -B package -DskipTests && docker build -t raftkv:latest .
#   docker compose -f docker/compose-3.yml up -d
# Clients on the host: RAFTKV_CLUSTER=1=localhost:7001,2=localhost:7002,3=localhost:7003
name: raftkv3

x-node: &node
  image: raftkv:latest
  restart: "no"
  stop_grace_period: 2s

services:
  node1:
    <<: *node
    command: ["server", "--id", "1", "--cluster", "1=node1:7000,2=node2:7000,3=node3:7000", "--data-dir", "/data"]
    ports: ["7001:7000"]
    volumes: ["node1:/data"]
  node2:
    <<: *node
    command: ["server", "--id", "2", "--cluster", "1=node1:7000,2=node2:7000,3=node3:7000", "--data-dir", "/data"]
    ports: ["7002:7000"]
    volumes: ["node2:/data"]
  node3:
    <<: *node
    command: ["server", "--id", "3", "--cluster", "1=node1:7000,2=node2:7000,3=node3:7000", "--data-dir", "/data"]
    ports: ["7003:7000"]
    volumes: ["node3:/data"]

volumes:
  node1: {}
  node2: {}
  node3: {}
