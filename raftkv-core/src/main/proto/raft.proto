syntax = "proto3";

package raftkv.raft;

option java_package = "io.raftkv.proto";
option java_multiple_files = true;

// Node-to-node RPCs from Figure 2 of the Raft paper.
service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

enum EntryType {
  COMMAND = 0;  // client command, handed to the state machine
  NOOP = 1;     // appended by a new leader to commit entries from earlier terms (§5.4.2, §8)
}

message LogEntry {
  int64 term = 1;
  int64 index = 2;
  EntryType type = 3;
  bytes data = 4;
}

message RequestVoteRequest {
  int64 term = 1;
  int32 candidate_id = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
}

message RequestVoteResponse {
  int64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  int64 term = 1;
  int32 leader_id = 2;
  int64 prev_log_index = 3;
  int64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  int64 leader_commit = 6;
}

message AppendEntriesResponse {
  int64 term = 1;
  bool success = 2;
  // On a log-matching failure: where the leader should retry from (§5.3 "accelerated log backtracking").
  // conflict_term = 0 means the follower's log is too short and conflict_index = its last index + 1.
  // Otherwise conflict_term is the follower's term at prev_log_index and conflict_index its first index in that term.
  int64 conflict_index = 3;
  int64 conflict_term = 4;
  // On success: the highest index known to match the leader's log.
  int64 match_index = 5;
}
